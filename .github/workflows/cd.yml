name: Continuous Deployment (CD) to Koyeb

on:
  push:
    branches:
      - main
      - module-2-exercise

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install Koyeb CLI
      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      # 3. Login ke Koyeb menggunakan token dari Secrets
      - name: Koyeb login
        run: echo "${{ secrets.KOYEB_API_TOKEN }}" | koyeb login --token

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t advshop:latest .

      # 5. Deploy ke Koyeb
      - name: Deploy to Koyeb
        run: |
          koyeb service update \
            --app advshop \
            --service advshop \
            --image advshop:latest \
            --region "ams" \
            --health-check-http "/"

      # 6. Tunggu hingga service sehat
      - name: Wait for service to be healthy
        run: |
          echo "Waiting for Koyeb service to be healthy..."
          sleep 15