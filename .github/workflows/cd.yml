name: Continuous Deployment (CD) to Koyeb

on:
  push:
    branches:
      - main
      - module-2-exercise

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Build Docker image
        run: docker build -t advshop:latest .

      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}  # <-- token disini
        run: |
          koyeb service update \
            --app advshop \
            --service advshop \
            --image advshop:latest \
            --region "ams" \
            --health-check-http "/"

      - name: Wait for service to be healthy
        run: |
          echo "Waiting for Koyeb service to be healthy..."
          sleep 15