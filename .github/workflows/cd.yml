name: Deploy to Koyeb (CD)

on:
  push:
    branches:
      - main
      - module-2-exercise

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Add Koyeb CLI to PATH
        run: |
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Deploy to Koyeb via Git
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          koyeb app update advshop \
            --git-repo https://github.com/A-Nadia-Aisyah-Fazila-2406495584/Modul-1-Coding-Standards.git \
            --git-branch main

      - name: Wait for service readiness
        run: |
          echo "Waiting for service to become healthy..."
          sleep 20