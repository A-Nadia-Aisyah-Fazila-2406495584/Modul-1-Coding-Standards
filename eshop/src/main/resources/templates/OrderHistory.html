<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Order History</title></head>
<body>
<h1>Order History</h1>
<form method="post" th:action="@{/order/history}">
    <label>Author Name: <input type="text" name="author" required/></label><br/>
    <button type="submit">Search</button>
</form>

<div th:if="${orders != null}">
    <h2>Orders by <span th:text="${author}"></span></h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Order Time</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        <tr th:each="order : ${orders}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.orderTime}"></td>
            <td th:text="${order.status}"></td>
            <td><a th:href="@{/order/pay/{id}(id=${order.id})}">Pay</a></td>
        </tr>
    </table>
</div>
</body>
</html>
